name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated ./debug.keystore"
          else
            echo "./debug.keystore already exists — skipping generation"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "Found $APK"
            ls -lh "$APK"
          else
            echo "ERROR: $APK not found"
            echo "Listing app/build/outputs/apk (if present):"
            find app/build/outputs/apk -type f 2>/dev/null || echo "(no files under app/build/outputs/apk)"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          NAME="${{ github.event.repository.name }}-debug-build-${{ github.run_number }}.apk"
          SRC="app/build/outputs/apk/debug/app-debug.apk"
          cp "$SRC" "$NAME"
          gh release create "$TAG" \
            --title "Debug APK build ${{ github.run_number }}" \
            --notes "Automated debug APK from commit ${{ github.sha }} (run ${{ github.run_number }}/${{ github.run_attempt }})." \
            --latest \
            "$NAME" \
          || echo "WARNING: GitHub Release creation failed; artifact upload still succeeded."
